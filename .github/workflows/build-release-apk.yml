name: Build Release APK

on:
  workflow_dispatch:
    inputs:
      without_patch:
        description: "Revert the second-screen patch before building (for testing)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
          fetch-depth: 0

      - name: Revert second-screen patch (test only)
        if: ${{ inputs.without_patch }}
        run: |
          git config user.email "ci@example.com"
          git config user.name "ci"
          SHA=$(git log --grep='Add second-screen support' --format=%H -1)
          [ -n "$SHA" ] || { echo "Patch commit not found"; exit 1; }
          echo "Reverting $SHA"
          git revert --no-edit "$SHA"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          SDKM="$(command -v sdkmanager || ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;29.0.14206865" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign with a throwaway key
        run: |
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug, O=Android, C=US"
          UNSIGNED=$(find app/build/outputs/apk/release -name "*-unsigned.apk" | head -1)
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks debug.keystore --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android \
            --out app-release-signed.apk "$UNSIGNED"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rotatingartlauncher-${{ inputs.without_patch && 'UNPATCHED' || 'patched' }}-release-apk
          path: app-release-signed.apk
          if-no-files-found: error
